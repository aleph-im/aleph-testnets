name: aleph-vm Upgrade Checks

# This branch's only job: validate aleph-vm upgrades and the Rust supervisor
# adoption path without a human in the loop (see README.md). This workflow
# lives only on this branch and never merges to main: every push to the
# branch runs it with the `env` defaults below (edit them, commit, push to
# re-run with different parameters), and the permanently-open draft PR from
# this branch gives the runs a checks UI. workflow_dispatch is kept for
# parameterized manual runs but GitHub only exposes it if this file also
# exists on the repository default branch; pushes are the primary trigger.
on:
  push:
    branches:
      - od/aleph-vm-upgrade-checks
  workflow_dispatch:
    inputs:
      baseline_version:
        description: "aleph-vm release installed first (scenario A baseline)"
        type: string
        default: "1.13.0"
      candidate_branch:
        description: "aleph-vm branch whose CI deb the CRN is upgraded to"
        type: string
        default: "od/vprogram-integration"
      rust_swap:
        description: "Run scenario B (ALEPH_VM_SUPERVISOR_IMPL python<->rust swap; needs Rust daemon increment 2+)"
        type: boolean
        default: false
      rust_lifecycle:
        description: "Also stop/start instances while the Rust daemon is active (increment 3+)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Defaults for push-triggered runs; workflow_dispatch inputs override them.
env:
  BASELINE_VERSION: "1.13.0"
  # V-PROGRAM control plane (aleph-vm #1050+#1052 aggregated on the
  # DO-NOT-MERGE deb-builder branch, aleph-vm PR #1070) on top of current
  # dev. Scenario: tests/test_vm_vprogram.py (Milestone A).
  CANDIDATE_BRANCH: "od/vprogram-integration"
  # Scenario B (ALEPH_VM_SUPERVISOR_IMPL python<->rust swap) needs a
  # candidate deb that ships the launcher (aleph-vm PR #1024 onwards).
  RUST_SWAP: "true"
  RUST_LIFECYCLE: "true"

jobs:
  # Fetch the measured SEV-SNP image + attest-cli, pinned on Aleph mainnet.
  # They are built ONCE locally (deterministic: fixed mkfs/verity seeds) and
  # uploaded to Aleph native storage, which is content-addressed, so CI fetches
  # them in seconds instead of compiling the musl cross-GCC toolchain + a custom
  # kernel from source (~2.5h; not substitutable from cache.nixos.org, and the
  # GH nix store cache does not survive the multi-user daemon's fresh path DB).
  # The pinned content is immutable, so the launch measurement baked into the
  # tarball stays deterministic. To refresh after an image change (an agent /
  # aleph-tee / nix change; daemon-side fixes like DHCP do NOT change it):
  # rebuild locally, `aleph file upload`, and bump SNP_IMAGE_HASH below.
  # Runs unconditionally (even on no-SNP runs): gating on the SNP secret would
  # skip this and cascade-skip upgrade-checks (needs: build-image); the artifact
  # is simply ignored when the SNP scenario is not configured.
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Aleph native-storage file hash (= sha256) of the image+attest-cli
      # tarball. STORE message 87287e4a5c8d7554a50f982cd681b64b2600c0bbb1c0b1e618465e022e01b977;
      # image measurement de933c37... (D4 tip: D2 DHCP + D3 chroot DNS/secrets
      # + D4 shellcheck directives; EPYC-v4, 2 vCPU). Immutable.
      SNP_IMAGE_HASH: 1db0d69c96dc7ed6c8a6cbb8c63f8de516ef4ed668e95c468cc216e4c44d911b
      SNP_IMAGE_GATEWAY: https://official.aleph.cloud
    steps:
      - name: Fetch measured image + attest-cli from Aleph
        run: |
          set -euo pipefail
          url="${SNP_IMAGE_GATEWAY}/api/v0/storage/raw/${SNP_IMAGE_HASH}"
          echo "Fetching $url"
          curl -fsSL --retry 5 --retry-delay 10 --max-time 300 "$url" -o snp-image.tar.gz
          echo "${SNP_IMAGE_HASH}  snp-image.tar.gz" | sha256sum -c -
          # Tarball layout: image/ (bzImage, initrd, rootfs.ext4[.verity/.roothash],
          # OVMF.fd, measurement.hex) + aleph-attest-cli. Stage into
          # snp-artifacts/{image,bin} so the download in upgrade-checks lands at
          # .local/snp/{image,bin} (what snp-artifacts.sh reads).
          mkdir -p snp-artifacts/bin
          tar xzf snp-image.tar.gz -C snp-artifacts
          mv snp-artifacts/aleph-attest-cli snp-artifacts/bin/aleph-attest-cli
          chmod +x snp-artifacts/bin/aleph-attest-cli
          echo "Measured image measurement: $(cat snp-artifacts/image/measurement.hex)"

      - name: Upload SNP image artifact
        uses: actions/upload-artifact@v4
        with:
          name: snp-image
          path: snp-artifacts/
          # Consumed within the same run by upgrade-checks; no need to keep it.
          retention-days: 1

  upgrade-checks:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: digitalocean
    # Serialize on the shared AMD SEV-SNP box, exactly like main's pr-tests.yml:
    # the static TEE server hosts one CI run at a time. This also serializes
    # upgrade-checks runs against each other (they share the group). When
    # AMD_SEV_SNP_HOST is unset the SNP steps skip but the group still queues
    # this run behind any pr-tests run — a harmless over-serialization we accept
    # so the two workflows can never collide on the box. (Was: group
    # upgrade-checks; widened for the additive SNP scenario.)
    concurrency:
      group: amd-sev-snp-server
      cancel-in-progress: false
    env:
      # DigitalOcean CRN droplets to provision. The SNP (TEE) CRN is the static
      # server at index ${CRN_COUNT} (= DO_CRN_COUNT), added on top when
      # configured; it is NOT provisioned/destroyed here.
      CRN_COUNT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 0700 ~/.ssh
          chmod 0600 ~/.ssh/id_ed25519
          # Keepalives: the upgrade tests have multi-minute polling phases with
          # no stdout, which lets the CI->droplet SSH session idle out as a
          # "Broken pipe". ControlMaster: reuse one TCP connection per host so
          # only the first connection is exposed to fresh-droplet kex flakes.
          cat > ~/.ssh/config <<'EOF'
          Host *
              ServerAliveInterval 30
              ServerAliveCountMax 20
              TCPKeepAlive yes
              ControlMaster auto
              ControlPath ~/.ssh/cm-%r@%h-%p
              ControlPersist 10m
          EOF
          chmod 0600 ~/.ssh/config

      - name: Determine SNP configuration
        id: snp
        # Secrets cannot be referenced directly in step `if:` conditions, so map
        # the presence of AMD_SEV_SNP_HOST to an output here and gate every SNP
        # step on it. Absent secret => the whole SNP scenario is skipped and a
        # plain upgrade-check run is unaffected.
        env:
          AMD_SEV_SNP_HOST: ${{ secrets.AMD_SEV_SNP_HOST }}
        run: |
          if [ -n "$AMD_SEV_SNP_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            # The static TEE CRN sits at index ${CRN_COUNT} (one past the DO CRNs).
            echo "TEE_IDX=${CRN_COUNT}" >> "$GITHUB_ENV"
            echo "SNP configured: TEE CRN at index ${CRN_COUNT}"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SNP not configured (AMD_SEV_SNP_HOST unset); SNP scenario will skip."
          fi

      - name: Create CCN and CRN Droplets
        run: |
          CCN_NAME="testnets-upg-${{ github.run_id }}"
          echo "DROPLET_NAME=$CCN_NAME" >> "$GITHUB_ENV"

          # Create CCN droplet
          doctl compute droplet create \
            --image ubuntu-24-04-x64 \
            --size s-4vcpu-8gb \
            --region ams3 \
            --ssh-keys ${{ vars.DO_SSH_KEY_FINGERPRINT }} \
            --tag-name testnets-ci \
            --wait \
            "$CCN_NAME" &
          CCN_PID=$!

          # Create CRN droplets in parallel (one per CRN_COUNT)
          declare -a CRN_PIDS=()
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            crn_name="testnets-crn-${idx}-upg-${{ github.run_id }}"
            echo "CRN_${idx}_NAME=$crn_name" >> "$GITHUB_ENV"

            doctl compute droplet create \
              --image debian-13-x64 \
              --size s-8vcpu-16gb \
              --region ams3 \
              --ssh-keys ${{ vars.DO_SSH_KEY_FINGERPRINT }} \
              --tag-name testnets-crn \
              --enable-ipv6 \
              --wait \
              "$crn_name" &
            CRN_PIDS+=($!)
          done

          wait $CCN_PID "${CRN_PIDS[@]}"

      - name: Get Droplet IPs
        timeout-minutes: 2
        run: |
          until DROPLET_IPV4=$(doctl compute droplet get "$DROPLET_NAME" --format PublicIPv4 --no-header 2>/dev/null) && [ -n "$DROPLET_IPV4" ]; do
            sleep 2
          done
          echo "DROPLET_IPV4=$DROPLET_IPV4" >> "$GITHUB_ENV"
          echo "CCN Droplet IP: $DROPLET_IPV4"

          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            name_var="CRN_${idx}_NAME"
            crn_name="${!name_var}"

            until ipv4=$(doctl compute droplet get "$crn_name" --format PublicIPv4 --no-header 2>/dev/null) && [ -n "$ipv4" ]; do
              sleep 2
            done
            echo "CRN_${idx}_IPV4=$ipv4" >> "$GITHUB_ENV"
            echo "CRN $idx Droplet IP: $ipv4"

            ipv6=$(doctl compute droplet get "$crn_name" --format PublicIPv6 --no-header 2>/dev/null || true)
            echo "CRN_${idx}_IPV6=$ipv6" >> "$GITHUB_ENV"
            echo "CRN $idx Droplet IPv6: $ipv6"
          done

      - name: Wait for SSH
        timeout-minutes: 3
        run: |
          until ssh-keyscan -H "$DROPLET_IPV4" >> ~/.ssh/known_hosts 2>/dev/null; do
            sleep 3
          done
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            ip_var="CRN_${idx}_IPV4"
            ip="${!ip_var}"
            until ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts 2>/dev/null; do
              sleep 3
            done
          done
          # Static SNP (TEE) server: already running, just trust its key.
          if [ "${{ steps.snp.outputs.configured }}" = "true" ]; then
            ssh-keyscan -H "${{ secrets.AMD_SEV_SNP_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Install system dependencies (CCN + CRN in parallel)
        run: |
          # CCN: wait for cloud-init, install docker + pip + gh
          # (gh downloads the candidate aleph-vm .deb from CI artifacts, both
          #  at install time when the manifesto pins a branch and mid-test for
          #  crn-up.sh --upgrade.)
          # NEEDRESTART_SUSPEND + disabled apt timers: see pr-tests.yml history,
          # avoids sshd restarts resetting in-flight connections.
          (
            ssh root@${DROPLET_IPV4} "cloud-init status --wait || true"
            ssh root@${DROPLET_IPV4} "systemctl disable --now apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true"
            ssh root@${DROPLET_IPV4} "while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 2; done"
            ssh root@${DROPLET_IPV4} "mkdir -p -m 755 /etc/apt/keyrings && \
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null && \
              chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && \
              echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' > /etc/apt/sources.list.d/github-cli.list"
            ssh root@${DROPLET_IPV4} "NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 update"
            ssh root@${DROPLET_IPV4} "NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 install -y docker.io docker-compose-v2 python3-pip jq curl gh"
            for i in $(seq 1 20); do ssh root@${DROPLET_IPV4} true 2>/dev/null && break; sleep 3; done
          ) &
          CCN_PID=$!

          # CRNs: wait for cloud-init, install docker + apparmor in parallel.
          declare -a CRN_PIDS=()
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            ip_var="CRN_${idx}_IPV4"
            ip="${!ip_var}"
            (
              ssh root@${ip} "cloud-init status --wait || true"
              ssh root@${ip} "systemctl disable --now apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true"
              ssh root@${ip} "while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 2; done"
              ssh root@${ip} "NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 update"
              ssh root@${ip} "NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 upgrade -y"
              ssh root@${ip} "NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=-1 install -y docker.io apparmor-profiles"
              for i in $(seq 1 20); do ssh root@${ip} true 2>/dev/null && break; sleep 3; done
            ) &
            CRN_PIDS+=($!)
          done

          wait $CCN_PID "${CRN_PIDS[@]}"

      - name: Rsync repo to Droplet
        run: |
          rsync -az \
            --exclude .git \
            --exclude contracts/out \
            --exclude contracts/cache \
            --exclude contracts/broadcast \
            --exclude .worktrees \
            --exclude bin \
            --exclude .local \
            --exclude __pycache__ \
            -e ssh \
            ./ root@${DROPLET_IPV4}:/opt/aleph-testnets/

      - name: Setup environment
        run: |
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && bash scripts/local-up.sh --env"

      - name: Start stack
        run: |
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && bash scripts/local-up.sh --up"

      - name: Deploy contracts and start indexer
        run: |
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && bash scripts/local-up.sh --deploy-contracts"

      - name: Install and register CRNs (baseline release)
        run: |
          # Write per-CRN state so crn-up.sh can find each droplet.
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            name_var="CRN_${idx}_NAME"
            ip_var="CRN_${idx}_IPV4"
            ipv6_var="CRN_${idx}_IPV6"
            crn_name="${!name_var}"
            crn_ip="${!ip_var}"
            crn_ipv6="${!ipv6_var}"

            ssh root@${DROPLET_IPV4} "mkdir -p /opt/aleph-testnets/.local/crn/${idx}"
            ssh root@${DROPLET_IPV4} "echo '$crn_name' > /opt/aleph-testnets/.local/crn/${idx}/droplet-name"
            ssh root@${DROPLET_IPV4} "echo '$crn_ip' > /opt/aleph-testnets/.local/crn/${idx}/droplet-ip"
            if [ -n "${crn_ipv6:-}" ]; then
              ssh root@${DROPLET_IPV4} "echo '$crn_ipv6' > /opt/aleph-testnets/.local/crn/${idx}/droplet-ipv6"
            fi
          done

          # Copy SSH key to CCN droplet so it (and the tests running there)
          # can reach the CRN hosts as root.
          scp ~/.ssh/id_ed25519 root@${DROPLET_IPV4}:/root/.ssh/id_ed25519
          ssh root@${DROPLET_IPV4} "chmod 600 /root/.ssh/id_ed25519"

          # Install the BASELINE release deb. The explicit ALEPH_VM_VERSION
          # wins over the manifesto's branch pin (the pin is the upgrade
          # candidate, installed mid-test by crn-up.sh --upgrade).
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            CCN_URL=http://${DROPLET_IPV4}:4024 \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            CRN_COUNT=${CRN_COUNT} \
            ALEPH_VM_VERSION='${{ inputs.baseline_version || env.BASELINE_VERSION }}' \
            bash scripts/crn-up.sh --install"

          # Register CRNs in corechannel aggregate
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            CCN_URL=http://${DROPLET_IPV4}:4024 \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            CRN_COUNT=${CRN_COUNT} \
            bash scripts/crn-up.sh --register"

      # ── SEV-SNP scenario (additive; skips cleanly when unconfigured) ────────
      - name: Register static SNP (TEE) CRN and install the candidate deb
        if: steps.snp.outputs.configured == 'true'
        run: |
          # Static TEE server as CRN index ${TEE_IDX} (mirrors main's
          # pr-tests.yml): static = don't provision/destroy/upgrade;
          # confidential = enable AMD SEV in supervisor.env; ssh-user = non-root
          # login support. Markers are written from the CCN droplet, so the
          # secrets never touch this runner's disk beyond this SSH payload.
          TEE_IDX="${TEE_IDX}"
          ssh root@${DROPLET_IPV4} "mkdir -p /opt/aleph-testnets/.local/crn/${TEE_IDX}"
          ssh root@${DROPLET_IPV4} "echo 'amd-sev-snp-server' > /opt/aleph-testnets/.local/crn/${TEE_IDX}/droplet-name"
          ssh root@${DROPLET_IPV4} "echo '${{ secrets.AMD_SEV_SNP_HOST }}' > /opt/aleph-testnets/.local/crn/${TEE_IDX}/droplet-ip"
          ssh root@${DROPLET_IPV4} "echo '${{ secrets.AMD_SEV_SNP_USER }}' > /opt/aleph-testnets/.local/crn/${TEE_IDX}/ssh-user"
          ssh root@${DROPLET_IPV4} "touch /opt/aleph-testnets/.local/crn/${TEE_IDX}/static /opt/aleph-testnets/.local/crn/${TEE_IDX}/confidential"

          # Install the CANDIDATE branch deb on JUST the TEE CRN (CRN_ONLY_INDEX):
          # it must carry the Rust supervisor + SEV-SNP + attest-cli, unlike the
          # DO CRNs which run the baseline release until scenario A upgrades them.
          # CRN_COUNT is widened to include the TEE index so the install loop
          # reaches it; CRN_ONLY_INDEX skips the DO CRNs.
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            CCN_URL=http://${DROPLET_IPV4}:4024 \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            CRN_COUNT=$((TEE_IDX + 1)) \
            CRN_ONLY_INDEX=${TEE_IDX} \
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            ALEPH_VM_BRANCH='${{ inputs.candidate_branch || env.CANDIDATE_BRANCH }}' \
            bash scripts/crn-up.sh --install"

          # Register the TEE CRN in the corechannel aggregate (scoped to its
          # index; the DO CRNs were registered in the previous step). Without
          # this the scheduler never discovers the SNP node, and v-programs
          # park as waiting-for-nodes forever.
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            CCN_URL=http://${DROPLET_IPV4}:4024 \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            CRN_COUNT=$((TEE_IDX + 1)) \
            CRN_ONLY_INDEX=${TEE_IDX} \
            bash scripts/crn-up.sh --register"

      - name: Download measured image + attest-cli (from build-image)
        if: steps.snp.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: snp-image
          # The artifact root is {image,bin} (build-image uploaded snp-artifacts/),
          # so this lands .local/snp/image/* and .local/snp/bin/aleph-attest-cli,
          # exactly the layout snp-artifacts.sh (SNP_STAGE_DIR=.local/snp) reads.
          path: .local/snp

      - name: Stage SNP artifacts to CCN + SNP host
        if: steps.snp.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # The measured image + attest-cli now arrive via the downloaded
          # `snp-image` artifact (built once, cached, off the SNP host's critical
          # path). upload/download-artifact drops the exec bit, so restore it.
          chmod +x .local/snp/bin/aleph-attest-cli
          chmod -R u+rw .local/snp/image
          echo "Measured image measurement: $(cat .local/snp/image/measurement.hex)"

          # Ship the staged artifacts to the CCN droplet, then run
          # snp-artifacts.sh there to push them to the SNP host + record the
          # measurement the test reads.
          rsync -az -e ssh .local/snp/ root@${DROPLET_IPV4}:/opt/aleph-testnets/.local/snp/
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            SNP_HOST='${{ secrets.AMD_SEV_SNP_HOST }}' \
            SNP_USER='${{ secrets.AMD_SEV_SNP_USER }}' \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            bash scripts/snp-artifacts.sh"

      - name: Run upgrade checks
        run: |
          # GH_TOKEN: the tests call crn-up.sh --upgrade, which downloads the
          # candidate deb from aleph-im/aleph-vm CI artifacts via gh.
          # Dispatch inputs win; push-triggered runs fall back to the env
          # defaults (inputs.* is empty on push events).
          RUST_SWAP=0; [ "${{ inputs.rust_swap || env.RUST_SWAP }}" = "true" ] && RUST_SWAP=1
          RUST_LC=0; [ "${{ inputs.rust_lifecycle || env.RUST_LIFECYCLE }}" = "true" ] && RUST_LC=1
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && \
            SSH_KEY_FILE=/root/.ssh/id_ed25519 \
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            ALEPH_VM_UPGRADE_BRANCH='${{ inputs.candidate_branch || env.CANDIDATE_BRANCH }}' \
            UPGRADE_CHECK_RUST=$RUST_SWAP \
            UPGRADE_CHECK_RUST_LIFECYCLE=$RUST_LC \
            bash scripts/local-up.sh --test"

      - name: Collect test results
        if: always()
        run: |
          scp root@${DROPLET_IPV4}:/opt/aleph-testnets/results.xml ./results.xml 2>/dev/null || true

      - name: Collect container logs
        if: always()
        run: |
          ssh root@${DROPLET_IPV4} "cd /opt/aleph-testnets && bash scripts/local-up.sh --logs" > docker-logs.txt 2>&1 || true

      - name: Collect CRN logs
        if: always()
        run: |
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            ip_var="CRN_${idx}_IPV4"
            ip="${!ip_var}"
            if [ -n "${ip:-}" ]; then
              # -n 5000: covers both the pre- and post-upgrade daemon runs.
              ssh root@${ip} "journalctl -u aleph-vm-supervisor.service --no-pager -n 5000" > "crn${idx}-supervisor.txt" 2>&1 || true
              ssh root@${ip} "journalctl -u aleph-vm-agent.service --no-pager -n 2000" > "crn${idx}-agent.txt" 2>&1 || true
              ssh root@${ip} "journalctl -u 'aleph-vm-controller@*' --no-pager -n 2000" > "crn${idx}-controllers.txt" 2>&1 || true
              ssh root@${ip} "docker logs vm-connector" > "crn${idx}-vm-connector.txt" 2>&1 || true
              ssh root@${ip} "cat /etc/aleph-vm/supervisor.env" > "crn${idx}-supervisor-env.txt" 2>&1 || true
            fi
          done

      - name: Collect SNP (TEE) server logs
        if: always() && steps.snp.outputs.configured == 'true'
        run: |
          TEE_HOST="${{ secrets.AMD_SEV_SNP_HOST }}"
          TEE_USER="${{ secrets.AMD_SEV_SNP_USER }}"
          # -n 5000 for the supervisor's settings dump; the controller units carry
          # each SNP guest's qemu serial console (essential when a guest never
          # reaches the attest-agent on 8443).
          if [ "$TEE_USER" = "root" ]; then
            ssh "root@$TEE_HOST" "journalctl -u aleph-vm-supervisor.service --no-pager -n 5000" > tee-supervisor.txt 2>&1 || true
            ssh "root@$TEE_HOST" "journalctl -u 'aleph-vm-controller@*' --no-pager -n 3000" > tee-controllers.txt 2>&1 || true
            ssh "root@$TEE_HOST" "cat /etc/aleph-vm/supervisor.env" > tee-supervisor-env.txt 2>&1 || true
          else
            ssh "$TEE_USER@$TEE_HOST" "sudo -n journalctl -u aleph-vm-supervisor.service --no-pager -n 5000" > tee-supervisor.txt 2>&1 || true
            ssh "$TEE_USER@$TEE_HOST" "sudo -n journalctl -u 'aleph-vm-controller@*' --no-pager -n 3000" > tee-controllers.txt 2>&1 || true
            ssh "$TEE_USER@$TEE_HOST" "sudo -n cat /etc/aleph-vm/supervisor.env" > tee-supervisor-env.txt 2>&1 || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-check-results
          path: |
            results.xml
            docker-logs.txt
            crn*-supervisor.txt
            crn*-agent.txt
            crn*-controllers.txt
            crn*-vm-connector.txt
            crn*-supervisor-env.txt
            tee-supervisor.txt
            tee-controllers.txt
            tee-supervisor-env.txt

      - name: Reset SNP (TEE) server
        if: always() && steps.snp.outputs.configured == 'true'
        run: |
          # Stop the supervisor, kill leftover QEMU, wipe execution state so this
          # run's SNP VM can't leak into the next. Idempotent.
          bash scripts/tee-reset.sh "${{ secrets.AMD_SEV_SNP_HOST }}" "${{ secrets.AMD_SEV_SNP_USER }}" ~/.ssh/id_ed25519 || true

      - name: Destroy CRN Droplets
        if: always()
        run: |
          for idx in $(seq 0 $((CRN_COUNT - 1))); do
            name_var="CRN_${idx}_NAME"
            crn_name="${!name_var}"
            if [ -n "${crn_name:-}" ]; then
              doctl compute droplet delete --force "$crn_name" || true
            fi
          done

      - name: Destroy Droplet
        if: always()
        run: |
          doctl compute droplet delete --force "$DROPLET_NAME" || true
