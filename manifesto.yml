# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    # 0.10.3-rc7 is the first pinned release with V-PROGRAM support: message
    # handler (handlers/content/vprogram.py), vms DB migration 0064 and the
    # V-PROGRAM cost model.
    tag: "0.10.3-rc7"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    # 0.17.0-rc9: TCB floors recalibrated to AMD's published EntrySign
    # (SB-3019) mitigation minimums (aleph-rs#340): Zen4c 28 -> 25,
    # Milan 213 -> 219 (the old value accepted EntrySign-vulnerable Milan
    # hosts), plus stepping-aware floors for Milan-X/Genoa-X. The testnet
    # TEE host still sits at SPL 21 (< 25) pending its Scaleway BIOS
    # update, so the test passes --min-tcb/--accept-outdated-tcb for now
    # (see tests/test_vprograms.py TCB_FLOOR_ARGS).
    version: "0.17.0-rc9"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.17.0-rc9/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  scheduler-rs:
    image: alephim/scheduler-rs
    # vprogram-rc1 = 0.1.2 (v2 executions polling, scheduler#188) plus
    # V-PROGRAM scheduling (scheduler#193): ingestion, VmType::VProgram,
    # SEV-SNP capability matching and the v_programs allocation bucket
    # (matches aleph-vm#1052's /control/allocations wire model). One-off
    # image published from the od/vprogram-scheduling branch.
    tag: "vprogram-rc1"

  scheduler-api:
    image: alephim/scheduler-api
    # Same od/vprogram-scheduling build as scheduler-rs above
    # (vm_type=v_program filter on /api/v1/vms).
    tag: "vprogram-rc1"

  aleph-vm:
    # od/vprogram-integration-2 (aleph-vm#1124, supersedes #1114's
    # od/vprogram-integration): current dev, which now includes the whole
    # V-PROGRAM stack (#1050, #1052, #1071, #1077, #1082, #1083) plus the
    # static-IPv6 DHCPv6 guest path (#1087), with the still-pending pieces
    # merged on top: attestation port map (#1079), port-forward healing on
    # re-adoption (#1085), measured workload-volume guest init, and the
    # update_refs V-PROGRAM fix.
    branch: "od/vprogram-integration-2"
    # To deploy from a Git branch instead of a release, replace `version` with:
    #   branch: "my-feature-branch"
    # This downloads the .deb from GitHub Actions CI artifacts (requires gh CLI).

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    tag: "v0.37.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
