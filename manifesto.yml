# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    # 0.11.2 (2026-08-31): 0.11.0 plus the strict V-PROGRAM scalar
    # ingestion (aleph-message 1.3.1, pyaleph#1261, serde parity with the
    # Rust SDK), Kubo >= v0.38 Provider config fixes and Ethereum sync
    # fixes. Still ships Kubo v0.43.0 (see infrastructure.ipfs).
    tag: "0.11.2"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    # 0.18.0 (2026-09-01): 0.17.0 plus V-PROGRAM verified data volumes
    # and the register-carrying verification results (aleph-rs#383/#385);
    # strict-scalar schema matching aleph-message 1.3.1 / pyaleph 0.11.2.
    version: "0.18.0"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.18.0/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  scheduler-rs:
    image: alephim/scheduler-rs
    # 0.2.2 (2026-09-14): pushes plans to /v2/control/allocations on CRNs
    # that advertise it (scheduler#208), re-pushes while a planned VM stays
    # missing (#209), places GPU V-PROGRAMs on confidential cards (#210).
    tag: "0.2.2"

  scheduler-api:
    image: alephim/scheduler-api
    # Same 0.2.2 release as scheduler-rs above.
    tag: "0.2.2"

  aleph-vm:
    # main after the dev-2.1 merge (2026-09-15), the 2.1.0 release candidate:
    # 2.0.1 plus the storage work (bounded download caches #1161, storage
    # status/reclaim/reconcile CLI #1162), the scheduler-allocation
    # reconciler #1173, the NVIDIA CC probes (#1196/#1197) and the
    # post-audit fixes (#1253, #1254, #1255). Guest images still come from
    # the pinned fixtures in scripts/vprogram-artifacts.sh.
    # Downloads the .deb from GitHub Actions CI artifacts.
    branch: "main"
    # To deploy from a release instead, replace `branch` with:
    #   version: "1.15.0"

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    # pyaleph 0.11.0 ships Kubo v0.43.0 (CVE-2026-46679, CVE-2026-57497).
    tag: "v0.43.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
