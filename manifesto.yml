# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    tag: "0.10.3-rc6"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    version: "0.11.1"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.11.1/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  # Scheduler images with V-PROGRAM scheduling (aleph-vm-scheduler PR #193).
  # Until #193 releases, build locally from branch od/vprogram-scheduling:
  #   docker build -f scheduler-rs/Dockerfile  -t alephim/scheduler-rs:vprogram-rc1  .
  #   docker build -f scheduler-api/Dockerfile -t alephim/scheduler-api:vprogram-rc1 .
  scheduler-rs:
    image: alephim/scheduler-rs
    tag: "vprogram-rc1"

  scheduler-api:
    image: alephim/scheduler-api
    tag: "vprogram-rc1"

  aleph-vm:
    # This branch (od/aleph-vm-upgrade-checks) only runs aleph-vm upgrade
    # checks, tracking the Rust supervisor port. The pin below is the default
    # *upgrade candidate*: scenario A upgrades a baseline release install to
    # this branch's CI .deb (downloaded from GitHub Actions artifacts, needs
    # the gh CLI). Runs override the candidate to the increment branch under
    # test via ALEPH_VM_UPGRADE_BRANCH / the workflow input; the baseline
    # release is chosen at install time with ALEPH_VM_VERSION, which wins
    # over this pin (see scripts/crn-up.sh).
    branch: "dev"

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    tag: "v0.37.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
