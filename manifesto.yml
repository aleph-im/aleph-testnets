# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    # 0.11.0 (2026-08-27): first stable release with the V-PROGRAM message
    # type, aleph-message 1.3.0 register-map measurements and V-PROGRAM
    # artifact pricing. Ships with Kubo v0.43.0 (see infrastructure.ipfs).
    tag: "0.11.0"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    # 0.17.0 (2026-08-27): first stable release of the `aleph vprogram`
    # tree (create/--compose, show, list, call, delete) and the RA-TLS
    # verifier with the EntrySign TCB floors, KDS CRL revocation and the
    # fresh-nonce liveness challenge; register-map measurements matching
    # pyaleph 0.11.0.
    version: "0.17.0"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.17.0/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  scheduler-rs:
    image: alephim/scheduler-rs
    # 0.2.0 (2026-08-26): first release carrying V-PROGRAM scheduling
    # (aleph-vm-scheduler#193: ingestion, VmType::VProgram, SEV-SNP
    # capability matching, the v_programs allocation bucket) on top of the
    # 0.1.2 v2-executions node_watcher.
    tag: "0.2.0"

  scheduler-api:
    image: alephim/scheduler-api
    # Same 0.2.0 release as scheduler-rs above (vm_type=v_program filter).
    tag: "0.2.0"

  aleph-vm:
    # main, which since 2026-08-27 carries everything dev had plus the 2.0
    # review follow-ups (#1168: attest-cli dropped in favour of the aleph-rs
    # verifier, attest-agent hardening, fail-closed guest init). #1169
    # (od/minimal-guest-kernel) is nix-only: not part of the deb, the guest
    # images come from the pinned fixtures in scripts/vprogram-artifacts.sh.
    # Downloads the .deb from GitHub Actions CI artifacts.
    branch: "main"
    # To deploy from a release instead, replace `branch` with:
    #   version: "1.15.0"

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    # pyaleph 0.11.0 ships Kubo v0.43.0 (CVE-2026-46679, CVE-2026-57497).
    tag: "v0.43.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
