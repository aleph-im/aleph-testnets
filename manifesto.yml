# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    # 0.12.0-rc2 (2026-09-29): 0.11.2 plus aleph-message 1.7.0 (the tdx
    # V-PROGRAM backend) and the runtime-platform/backend consistency check
    # (pyaleph#1273). Still ships Kubo v0.43.0 (see infrastructure.ipfs).
    tag: "0.12.0-rc2"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    # 0.19.0 (2026-09-16): 0.18.x plus the SEV-SNP confidential instance
    # client (create, attest, unlock; aleph-rs#394), the confidential GPU
    # requirement on V-PROGRAM content (#397), the owner's
    # /machine/{ref}/start route (#398, the 2.1 "stopped stays stopped"
    # counterpart), `aleph vprogram run` local boot test (#393), and the
    # credit transfer expiration serialization fix (#399).
    version: "0.19.0"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.19.0/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  scheduler-rs:
    image: alephim/scheduler-rs
    # 0.2.3-rc1 (2026-09-30): 0.2.2 plus confidential GPUs on SEV-SNP
    # instances (scheduler#216) and Intel TDX V-PROGRAM placement on CRNs
    # advertising tee.tdx (#217, SDK pinned at a tdx-aware manifest reader).
    tag: "0.2.3-rc1"

  scheduler-api:
    image: alephim/scheduler-api
    # Same 0.2.3-rc1 release as scheduler-rs above.
    tag: "0.2.3-rc1"

  aleph-vm:
    # 2.1.0 (2026-09-15, tag = main 3579c430, the build the last green run
    # of the 2.1 chain used): 2.0.1 plus the storage work (bounded download
    # caches #1161, storage status/reclaim/reconcile CLI #1162, disks
    # reclaimed on delete), v2 scheduler allocations with a background
    # reconciler (#1173, #1242), the Python supervisor removed (#1170,
    # ALEPH_VM_SUPERVISOR_IMPL is ignored), experimental NVIDIA CC for
    # V-PROGRAMs, and the post-audit fixes (#1253, #1254, #1255). Guest
    # images still come from the pinned fixtures in
    # scripts/vprogram-artifacts.sh.
    version: "2.1.0"
    # To deploy from a Git branch instead of a release, replace `version` with:
    #   branch: "my-feature-branch"
    # This downloads the .deb from GitHub Actions CI artifacts (requires gh CLI).

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    # pyaleph 0.11.0 ships Kubo v0.43.0 (CVE-2026-46679, CVE-2026-57497).
    tag: "v0.43.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
