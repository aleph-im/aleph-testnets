# manifesto.yml — Version pins for testnet components
#
# "components" are the software under test. PRs bump these.
# "infrastructure" contains companion services that change infrequently.

components:
  pyaleph:
    image: alephim/pyaleph-node
    # 0.10.3-rc7 is the first pinned release with V-PROGRAM support: message
    # handler (handlers/content/vprogram.py), vms DB migration 0064 and the
    # V-PROGRAM cost model.
    tag: "0.10.3-rc7"

  p2p-service:
    image: alephim/p2p-service
    tag: "0.1.5"

  aleph-cli:
    # 0.17.0-rc5: vprogram command set (create/show/call with RA-TLS
    # attestation verification), create --wait polling for the attested
    # endpoint (aleph-rs#318), named attestation-rejection errors
    # (aleph-rs#319), the attestation DTO aligned with the guest agent's
    # {tee_type, data} schema (aleph-rs#321), the key-binding hash
    # domain-separated to match the agent's
    # SHA-384("aleph-attest-tls-key-v1\0" || pubkey) report_data
    # (aleph-rs#323), and `call` writing the response body verbatim to
    # stdout with the HTTP status on stderr (aleph-rs#325).
    version: "0.17.0-rc5"
    url: "https://github.com/aleph-im/aleph-rs/releases/download/v0.17.0-rc5/aleph-cli-linux-x86_64"

  indexer:
    image: alephim/credit-indexer
    tag: "latest"

  credit-service:
    image: alephim/credit-service
    tag: "latest"

  scheduler-rs:
    image: alephim/scheduler-rs
    # vprogram-rc1 = 0.1.2 (v2 executions polling, scheduler#188) plus
    # V-PROGRAM scheduling (scheduler#193): ingestion, VmType::VProgram,
    # SEV-SNP capability matching and the v_programs allocation bucket
    # (matches aleph-vm#1052's /control/allocations wire model). One-off
    # image published from the od/vprogram-scheduling branch.
    tag: "vprogram-rc1"

  scheduler-api:
    image: alephim/scheduler-api
    # Same od/vprogram-scheduling build as scheduler-rs above
    # (vm_type=v_program filter on /api/v1/vms).
    tag: "vprogram-rc1"

  aleph-vm:
    # od/vprogram-integration = dev (gRPC split, #1012) plus the full
    # V-PROGRAM stack (#1050..#1079): scheduler support + SNP vCPU
    # advertising, SEV-SNP launch path, measured workload volumes with
    # dm-verity roothash in the measured cmdline, fib-service demo workload,
    # and the attestation port mapped to a host IPv4 port (#1079).
    branch: "od/vprogram-integration"
    # To deploy from a Git branch instead of a release, replace `version` with:
    #   branch: "my-feature-branch"
    # This downloads the .deb from GitHub Actions CI artifacts (requires gh CLI).

infrastructure:
  vm-connector:
    image: ghcr.io/aleph-im/vm-connector
    tag: "alpha"

  postgres:
    image: postgres
    tag: "15.3"
  rabbitmq:
    image: rabbitmq
    tag: "3.11.15-management"
  redis:
    image: redis
    tag: "8.4.0"
  ipfs:
    image: ipfs/kubo
    tag: "v0.37.0"
  anvil:
    image: ghcr.io/foundry-rs/foundry
    tag: "stable"
