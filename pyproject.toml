[project]
name = "aleph-testnets"
version = "0.1.0"
description = "Integration tests for Aleph Cloud testnets"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0",
    # V-PROGRAM publishing (temporary: switch to the aleph-rs CLI once its rc
    # ships vprogram support). The aleph-message git pin is the V-PROGRAM
    # schema branch (PR #158), the same ref pyaleph 0.10.3-rc6 pins.
    "aleph-sdk-python>=2.0",
    "aleph-message @ git+https://github.com/aleph-im/aleph-message.git@bc9c0f86958a746faeecbd6c6f96cc6f5b4538de",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
